{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mb-3">Sign in</h1>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    {{ csrf() }}
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required autocomplete="username">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
  <p class="mt-3 small">New here? <a href="{{ url_for('auth.register') }}">Create a citizen account</a>.</p>
</div></div>
{% endblock %}
